<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">

  <div class="max-w-7xl mx-auto px-6 py-10">

    <!-- HEADER -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-4xl font-bold text-slate-900">
          Open Projects
        </h1>
        <p class="text-slate-500 mt-2">
          {{ filteredProjects.length }} projects available
        </p>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="mb-10">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange($event)"
        placeholder="Search projects by title, description or category..."
        class="w-full px-6 py-4 rounded-2xl border-2 border-slate-200 shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all"
      />
    </div>

    <!-- LOADING -->
    <div *ngIf="loading" class="text-center py-20">
      <p class="text-slate-500">Loading projects...</p>
    </div>

    <!-- ERROR -->
    <div *ngIf="error" class="text-center text-red-600 py-10">
      {{ error }}
    </div>

    <!-- GRID -->
    <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 gap-8">

      <div
        *ngFor="let project of filteredProjects"
        class="bg-white rounded-2xl shadow-md border border-slate-200 p-6 hover:shadow-xl hover:border-indigo-300 transition-all duration-300 group"
      >

        <!-- Title -->
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xl font-bold text-slate-900 group-hover:text-indigo-600 transition">
            {{ project.title }}
          </h2>

          <span class="bg-green-100 text-green-700 text-xs font-semibold px-3 py-1 rounded-full">
            OPEN
          </span>
        </div>

        <!-- Description -->
        <p class="text-slate-600 text-sm mb-4 line-clamp-2">
          {{ project.shortDescription }}
        </p>

        <!-- Tags -->
        <div class="flex flex-wrap gap-2 mb-5">
          <span class="bg-indigo-50 text-indigo-600 text-xs px-3 py-1 rounded-lg font-medium">
            {{ project.category }}
          </span>

          <span class="bg-slate-100 text-slate-600 text-xs px-3 py-1 rounded-lg">
            Budget: ${{ project.budget }}
          </span>
        </div>

        <!-- Footer -->
        <div class="flex items-center justify-between border-t pt-4">

          <div class="text-sm text-slate-500">
            Posted recently
          </div>

          <div class="flex gap-3">

            <button
              (click)="viewDetails(project.id)"
              class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 transition text-sm"
            >
              View
            </button>

            <button
              (click)="submitOffer(project.id)"
              class="px-5 py-2 rounded-lg bg-gradient-to-r from-indigo-600 to-blue-600 text-white text-sm font-semibold shadow-md hover:shadow-lg hover:scale-[1.02] transition-all"
            >
              Submit Offer
            </button>

          </div>
        </div>

      </div>

    </div>

    <!-- EMPTY STATE -->
    <div *ngIf="!loading && filteredProjects.length === 0" class="text-center py-20">
      <p class="text-slate-500 text-lg">
        No matching projects found.
      </p>
    </div>

  </div>

</div>
