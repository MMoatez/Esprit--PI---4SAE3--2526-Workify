# ===============================
# SERVER
# ===============================
server.port=8086
spring.application.name=feedback-service

# ===============================
# EUREKA
# ===============================
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.fetchRegistry=true
eureka.client.registerWithEureka=true

# ===============================
# DATASOURCE — MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/workify_feedback_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FEIGN — project-service
# ===============================
project-service.url=http://localhost:8063

# ===============================
# EVALUATION WINDOW
# deadline-hours: duration the client has to submit feedback (default 24h, max 168h = 7 days)
# reminder-hours: send reminder this many hours before deadline (default 1h)
# ===============================
feedback.evaluation.deadline-hours=24
feedback.evaluation.reminder-hours=1
feedback.scheduler.rate-ms=60000

# ===============================
# JACKSON — dates ISO 8601
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# ERROR
# ===============================
server.error.include-message=always

spring.main.web-application-type=servlet
spring.main.allow-bean-definition-overriding=true

# ===============================
# CORS
# ===============================
spring.web.cors.allowed-origins=http://localhost:4200

# ===============================
# PLATFORM URL (used for QR code in PDF)
# ===============================
platform.url=http://localhost:4200

# ===============================
# AI — HuggingFace Inference API
# ===============================
huggingface.api.key=${HUGGINGFACE_API_KEY:your-huggingface-api-key-here}

# ===============================
# MEDIA UPLOAD
# ===============================
feedback.upload.dir=./uploads/feedback
feedback.upload.max-size-mb=20
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
