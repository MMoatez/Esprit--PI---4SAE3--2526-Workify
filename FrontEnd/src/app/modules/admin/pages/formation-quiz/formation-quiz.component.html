<div class="min-h-screen bg-slate-50 py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold text-[#002D44]">Final Assessment Management</h1>
                <p class="text-slate-500 mt-1">Configure the final quiz that students must pass to obtain their certificate.</p>
            </div>
            <button (click)="goBack()"
                    class="px-6 py-3 bg-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-300 transition-all">
                Back to Courses
            </button>
        </div>

        <div *ngIf="loading" class="text-center py-20 bg-white rounded-3xl shadow-sm border border-slate-100">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-[#00C3A5] mx-auto mb-4"></div>
            <p class="text-slate-500 font-medium">Loading quiz data...</p>
        </div>

        <div *ngIf="!loading" class="bg-white rounded-[2.5rem] border border-slate-100 p-10 shadow-xl mb-12 animate-slide-up">
            <div *ngIf="successMessage" class="mb-8 p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl font-medium">
                {{ successMessage }}
            </div>
            <div *ngIf="errorMessage" class="mb-8 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl font-medium">
                {{ errorMessage }}
            </div>

            <div class="space-y-10">
                <!-- Quiz Title -->
                <div class="space-y-4">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Quiz Title *</label>
                    <input type="text" [(ngModel)]="quiz.title"
                           class="w-full px-6 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-[#00C3A5] outline-none text-slate-700 font-bold transition-all"
                           placeholder="Ex: Final Certification Exam">
                </div>

                <hr class="border-slate-100">

                <!-- Questions List -->
                <div class="space-y-8">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold text-[#002D44]">Questions ({{ quiz.questions.length }})</h2>
                        <button (click)="addQuestion()" 
                                class="px-5 py-2 bg-[#00C3A5] text-white rounded-xl font-bold flex items-center gap-2 hover:bg-[#00AF94] transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                            Add Question
                        </button>
                    </div>

                    <div *ngFor="let question of quiz.questions; let i = index" 
                         class="bg-slate-50 rounded-[2rem] p-8 border border-slate-100 group relative">
                        <button (click)="removeQuestion(i)" 
                                class="absolute top-6 right-6 p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all opacity-0 group-hover:opacity-100">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>

                        <div class="space-y-6">
                            <div class="space-y-2">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest">Question {{ i + 1 }}</label>
                                <input type="text" [(ngModel)]="question.text"
                                       class="w-full px-5 py-3 bg-white border border-slate-200 rounded-xl focus:border-[#00C3A5] outline-none text-slate-700 font-medium transition-all"
                                       placeholder="Enter your question text here...">
                            </div>

                            <div class="space-y-4">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest">Options</label>
                                <div class="grid grid-cols-1 gap-3">
                                    <div *ngFor="let option of question.options; let j = index" 
                                         class="flex items-center gap-4">
                                        <button (click)="setCorrectOption(i, j)"
                                                [class.bg-green-500]="option.isCorrect"
                                                [class.border-green-500]="option.isCorrect"
                                                [class.bg-white]="!option.isCorrect"
                                                class="flex-shrink-0 w-8 h-8 rounded-full border-2 border-slate-200 flex items-center justify-center transition-all">
                                            <svg *ngIf="option.isCorrect" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                            </svg>
                                        </button>
                                        <input type="text" [(ngModel)]="option.text"
                                               class="flex-1 px-4 py-2 bg-white border border-slate-200 rounded-lg focus:border-[#00C3A5] outline-none text-slate-600 transition-all"
                                               [placeholder]="'Option ' + (j + 1)">
                                        <button (click)="removeOption(i, j)" 
                                                class="text-slate-300 hover:text-red-500 transition-colors">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                            </svg>
                                        </button>
                                    </div>
                                    <button (click)="addOption(i)" 
                                            class="text-left px-4 py-2 text-slate-400 hover:text-[#00C3A5] text-sm font-bold transition-all w-fit">
                                        + Add Option
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div *ngIf="quiz.questions.length === 0" class="text-center py-12 border-2 border-dashed border-slate-200 rounded-[2.5rem]">
                        <p class="text-slate-400 font-medium">No questions added yet.</p>
                        <button (click)="addQuestion()" class="text-[#00C3A5] font-bold mt-2 hover:underline">Create your first question</button>
                    </div>
                </div>

                <div class="pt-10 border-t border-slate-100">
                    <button (click)="onSave()" [disabled]="saving || quiz.questions.length === 0"
                            class="w-full py-5 bg-[#002D44] text-white rounded-2xl font-bold text-xl hover:bg-[#001A29] transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-xl">
                        {{ saving ? 'Saving Quiz...' : 'Save Assessment' }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
