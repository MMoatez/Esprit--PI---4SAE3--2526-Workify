# Profil de test: on évite toute dépendance à un service externe (MySQL, etc.)
# et on force une DB en mémoire.

spring.datasource.url=jdbc:h2:mem:workify_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Réduction du bruit en test
logging.level.org.springframework=warn

