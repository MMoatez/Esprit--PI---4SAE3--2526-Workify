<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50 flex items-center justify-center px-4">
  <div class="max-w-4xl w-full">
    <div class="text-center">
      <!-- Animated 404 Illustration -->
      <div class="mb-8 relative">
        <div class="inline-block relative">
          <h1 class="text-9xl sm:text-[12rem] font-black bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 bg-clip-text text-transparent animate-pulse">
            404
          </h1>
          
          <div class="absolute -top-8 -right-8 w-24 h-24 bg-blue-500/20 rounded-full blur-2xl animate-bounce"></div>
          <div class="absolute -bottom-8 -left-8 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl animate-bounce delay-150"></div>
        </div>
        
        <div class="mt-6 inline-flex items-center justify-center w-24 h-24 bg-white rounded-full shadow-xl border-4 border-blue-100">
          <svg class="w-12 h-12 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
      </div>

      <!-- Message -->
      <div class="mb-8">
        <h2 class="text-3xl sm:text-4xl font-bold text-slate-900 mb-4">
          Oops! Page Not Found
        </h2>
        <p class="text-lg text-slate-600 max-w-2xl mx-auto">
          The page you're looking for seems to have wandered off. Don't worry, even the best explorers get lost sometimes!
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row gap-4 justify-center mb-12">
        <button 
          (click)="goHome()"
          class="px-8 py-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold rounded-xl hover:from-blue-700 hover:to-purple-700 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-1 flex items-center justify-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          </svg>
          Back to Home
        </button>
        <button 
          (click)="goBack()"
          class="px-8 py-4 bg-white border-2 border-slate-300 text-slate-900 font-bold rounded-xl hover:bg-slate-50 hover:border-slate-400 transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Go Back
        </button>
      </div>

      <!-- Quick Links -->
      <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 max-w-2xl mx-auto">
        <h3 class="text-xl font-bold text-slate-900 mb-6">
          Maybe you were looking for:
        </h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Browse Projects -->
          <button 
            (click)="browseProjects()"
            class="group flex items-center gap-4 p-4 bg-blue-50 hover:bg-blue-100 rounded-xl transition-all text-left border border-blue-200 hover:border-blue-300"
          >
            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
              <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <rect width="18" height="18" x="3" y="3" rx="2" stroke-width="2"/>
                <path d="M3 9h18" stroke-width="2"/>
                <path d="M9 21V9" stroke-width="2"/>
              </svg>
            </div>
            <div>
              <div class="font-bold text-slate-900 mb-1">Browse Projects</div>
              <div class="text-sm text-slate-600">Find your next opportunity</div>
            </div>
          </button>

          <!-- Find Freelancers -->
          <button 
            (click)="findFreelancers()"
            class="group flex items-center gap-4 p-4 bg-purple-50 hover:bg-purple-100 rounded-xl transition-all text-left border border-purple-200 hover:border-purple-300"
          >
            <div class="w-12 h-12 bg-purple-600 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
              <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4" stroke-width="2"></circle>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </div>
            <div>
              <div class="font-bold text-slate-900 mb-1">Find Freelancers</div>
              <div class="text-sm text-slate-600">Hire talented professionals</div>
            </div>
          </button>

          <!-- View Subscription Plans - CORRIGÉ ICI -->
          <button 
            (click)="goToSubscription()"
            class="group flex items-center gap-4 p-4 bg-green-50 hover:bg-green-100 rounded-xl transition-all text-left border border-green-200 hover:border-green-300"
          >
            <div class="w-12 h-12 bg-green-600 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
              <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <rect width="20" height="14" x="2" y="5" rx="2" stroke-width="2"></rect>
                <line x1="2" x2="22" y1="10" y2="10" stroke-width="2"></line>
              </svg>
            </div>
            <div>
              <div class="font-bold text-slate-900 mb-1">Subscription Plans</div>
              <div class="text-sm text-slate-600">Upgrade your account</div>
            </div>
          </button>

          <!-- Contact Support -->
          <button 
            (click)="contactSupport()"
            class="group flex items-center gap-4 p-4 bg-orange-50 hover:bg-orange-100 rounded-xl transition-all text-left border border-orange-200 hover:border-orange-300"
          >
            <div class="w-12 h-12 bg-orange-600 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
              <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
              </svg>
            </div>
            <div>
              <div class="font-bold text-slate-900 mb-1">Contact Support</div>
              <div class="text-sm text-slate-600">We're here to help</div>
            </div>
          </button>
        </div>
      </div>

      <!-- Fun Message -->
      <div class="mt-8 text-slate-500 text-sm">
        <p>Lost? Think of this as an unexpected coffee break ☕</p>
      </div>
    </div>
  </div>
</div>
