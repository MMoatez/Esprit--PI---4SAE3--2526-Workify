# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8063
spring.application.name=project-service

# ===============================
# EUREKA CLIENT CONFIGURATION
# ===============================
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.fetchRegistry=true
eureka.client.registerWithEureka=true

# ===============================
# SPRING DATASOURCE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/workify_project_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# SPRING SECURITY (Optional)
# ===============================
spring.security.user.name=admin
spring.security.user.password=password

# ===============================
# CORS CONFIGURATION
# ===============================
spring.web.cors.allow-credentials=true
spring.web.cors.allowed-origins=http://localhost:4200

# ===============================
# SESSION CONFIGURATION
# ===============================
server.servlet.session.timeout=30m

# ===============================
# ERROR HANDLING
# ===============================
server.error.include-message=always
spring.main.web-application-type=servlet
spring.main.allow-bean-definition-overriding=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=nourjbeli78@gmail.com
spring.mail.password=xoglkcxbcwdxqxyo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false
openai.api.key=${OPENAI_API_KEY:your-openai-api-key-here}
openai.api.url=https://api.openai.com/v1
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=TRACE
groq.api.key=${GROQ_API_KEY:your-groq-api-key-here}
gemini.api.key=${GEMINI_API_KEY:your-gemini-api-key-here}

# ===============================
# FEEDBACK-SERVICE INTEGRATION
# ===============================
feedback-service.url=http://localhost:8086
