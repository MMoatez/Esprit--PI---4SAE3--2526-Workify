server:
  port: 8082

spring:
  application:
    name: formation-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/formationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/workify}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/workify}/protocol/openid-connect/certs}

app:
  upload:
    lesson-pdf-dir: ${LESSON_PDF_UPLOAD_DIR:./data/lesson-pdfs}

logging:
  level:
    com.workify.formationservice: DEBUG
    org.springframework.security: DEBUG
