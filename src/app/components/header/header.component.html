<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2 group">
        <img
          src="images/logo.png"
          alt="Workify Logo"
          class="h-24 w-auto transition-transform group-hover:scale-105"
        />
      </a>

      <!-- Desktop Navigation -->
      <nav class="hidden lg:flex items-center gap-1">

        <!-- Home -->
        <a
          routerLink="/"
          [class]="
            'flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
            (isActive('/') && currentPath === '/'
              ? 'bg-blue-50 text-blue-600'
              : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900')
          "
        >
          <span>Home</span>
        </a>

        <!-- Browse Projects -->
        <a
          routerLink="/projects"
          [class]="
            'flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
            (isActive('/projects')
              ? 'bg-blue-50 text-blue-600'
              : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900')
          "
        >
          <span>Browse Projects</span>
        </a>

        <!-- My Offers -->
        <a
          routerLink="/my-offers"
          [class]="
            'flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
            (isActive('/my-offers')
              ? 'bg-blue-50 text-blue-600'
              : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900')
          "
        >
          <span>My Offers</span>
        </a>

        <!-- Find Freelancers -->
        <a
          routerLink="/freelancers"
          [class]="
            'flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
            (isActive('/freelancers')
              ? 'bg-blue-50 text-blue-600'
              : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900')
          "
        >
          <span>Find Freelancers</span>
        </a>

        <!-- Subscription -->
        <a
          routerLink="/freelancers/subscription"
          [class]="
            'flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
            (isActive('/freelancers/subscription')
              ? 'bg-blue-50 text-blue-600'
              : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900')
          "
        >
          <span>Subscription</span>
        </a>

        <!-- My Projects -->
        <a
          routerLink="/my-projects"
          [class]="
            'flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
            (isActive('/my-projects')
              ? 'bg-blue-50 text-blue-600'
              : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900')
          "
        >
          <span>My Projects</span>
        </a>

        <!-- Chatbot -->
        <a
          routerLink="/chatbot"
          [class]="
            'flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
            (isActive('/chatbot')
              ? 'bg-blue-50 text-blue-600'
              : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900')
          "
        >
          <span>Chatbot</span>
        </a>

        <!-- ✦ AI Recommendation -->
        <a
          routerLink="/recommendation"
          [class]="
            'flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold transition-all ' +
            (isActive('/recommendation')
              ? 'bg-blue-600 text-white'
              : 'text-violet-600 hover:bg-violet-50 hover:text-violet-700')
          "
        >
          ✦ AI Recommendation
        </a>

      </nav>

      <!-- CTA Buttons -->
      <div class="hidden lg:flex items-center gap-3">
        <button class="px-4 py-2 text-sm font-medium text-slate-700 hover:text-blue-600 transition-colors">
          Sign In
        </button>
        <button class="px-5 py-2 text-sm font-semibold bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all shadow-sm hover:shadow-md">
          Get Started
        </button>
      </div>

      <!-- Mobile menu button -->
      <button
        (click)="toggleMobileMenu()"
        class="lg:hidden p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors"
      >
        ☰
      </button>

    </div>

    <!-- Mobile Navigation -->
    <div
      *ngIf="mobileMenuOpen"
      class="lg:hidden pb-4 animate-fadeIn border-t border-slate-100 mt-2"
    >
      <nav class="flex flex-col gap-1 mt-2">

        <a routerLink="/" class="px-4 py-2 text-sm">Home</a>
        <a routerLink="/projects" class="px-4 py-2 text-sm">Browse Projects</a>
        <a routerLink="/my-offers" class="px-4 py-2 text-sm">My Offers</a>
        <a routerLink="/my-projects" class="px-4 py-2 text-sm">My Projects</a>
        <a routerLink="/freelancers" class="px-4 py-2 text-sm">Find Freelancers</a>
        <a routerLink="/freelancers/subscription" class="px-4 py-2 text-sm">Subscription</a>
        <a routerLink="/chatbot" class="px-4 py-2 text-sm">Chatbot</a>

        <!-- ✦ AI Recommendation Mobile -->
        <a
          routerLink="/recommendation"
          class="px-4 py-2 text-sm font-semibold text-violet-600 hover:bg-violet-50 rounded-lg"
        >
          ✦ AI Recommendation
        </a>

        <div class="flex flex-col gap-2 mt-3 px-2">
          <button class="px-4 py-2 text-sm border border-slate-200 rounded-lg">
            Sign In
          </button>
          <button class="px-4 py-2 text-sm font-semibold bg-blue-600 text-white rounded-lg">
            Get Started
          </button>
        </div>

      </nav>
    </div>

  </div>
</header>
