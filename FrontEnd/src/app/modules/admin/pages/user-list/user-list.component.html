<div class="space-y-6">
    <!-- Header & Search -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <h1 class="text-2xl font-bold text-slate-800">Users</h1>
        <div class="relative w-full sm:w-72">
            <input type="text" [(ngModel)]="searchTerm" (keyup.enter)="onSearch()" placeholder="Search..."
                class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all shadow-sm">
            <span class="absolute left-3 top-2.5 text-slate-400">🔍</span>
        </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-slate-50 text-slate-900 font-semibold border-b border-slate-200">
                    <tr>
                        <th class="px-6 py-4">User</th>
                        <th class="px-6 py-4">Role</th>
                        <th class="px-6 py-4">Status</th>
                        <th class="px-6 py-4">Registration Date</th>
                        <th class="px-6 py-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr *ngFor="let user of users" class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 font-bold overflow-hidden shrink-0">
                                    <img *ngIf="user.profilePicture" [src]="getAvatarUrl(user)"
                                        class="w-full h-full object-cover">
                                    <span *ngIf="!user.profilePicture">{{ getInitials(user) }}</span>
                                </div>
                                <div>
                                    <div class="font-medium text-slate-900">
                                        {{ user.firstName }} {{ user.lastName }}
                                        <span *ngIf="!user.firstName && !user.lastName" class="italic text-slate-400">No
                                            name</span>
                                    </div>
                                    <div class="text-slate-500">{{ user.email }}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded-md text-xs font-medium" [ngClass]="{
                                    'bg-blue-50 text-blue-700': user.role === 'CLIENT',
                                    'bg-purple-50 text-purple-700': user.role === 'FREELANCER',
                                    'bg-slate-100 text-slate-700': user.role === 'ADMIN'
                                }">
                                {{ user.role }}
                            </span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded-full text-xs font-medium" [ngClass]="{
                                    'bg-green-100 text-green-700': user.accountStatus === 'ACTIVE',
                                    'bg-red-100 text-red-700': user.accountStatus === 'SUSPENDED' || user.accountStatus === 'INACTIVE'
                                }">
                                {{ user.accountStatus }}
                            </span>
                        </td>
                        <td class="px-6 py-4">
                            {{ user.inscriptionDate | date:'mediumDate' }}
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button (click)="toggleStatus(user)"
                                class="text-sm font-medium hover:underline transition-colors focus:outline-none"
                                [ngClass]="user.accountStatus === 'ACTIVE' ? 'text-red-600' : 'text-green-600'">
                                {{ user.accountStatus === 'ACTIVE' ? 'Block' : 'Unblock' }}
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="users.length === 0 && !isLoading">
                        <td colspan="5" class="px-6 py-8 text-center text-slate-500">
                            No users found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="px-6 py-4 border-t border-slate-200 flex items-center justify-between" *ngIf="totalPages > 1">
            <span class="text-sm text-slate-500">
                Page {{ currentPage + 1 }} of {{ totalPages }}
            </span>
            <div class="flex gap-2">
                <button (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 0"
                    class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    Previous
                </button>
                <button (click)="onPageChange(currentPage + 1)" [disabled]="currentPage >= totalPages - 1"
                    class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    Next
                </button>
            </div>
        </div>
    </div>
</div>
