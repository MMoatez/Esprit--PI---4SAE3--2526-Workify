# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8096
spring.application.name=event-service

# ===============================
# EUREKA CLIENT CONFIGURATION
# ===============================
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.fetchRegistry=true
eureka.client.registerWithEureka=true

# ===============================
# SPRING DATASOURCE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/workify_event_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# CORS CONFIGURATION
# ===============================
spring.web.cors.allow-credentials=true
spring.web.cors.allowed-origins=http://localhost:4200

# ===============================
# SESSION CONFIGURATION
# ===============================
server.servlet.session.timeout=30m

# ===============================
# ERROR HANDLING
# ===============================
server.error.include-message=always
spring.main.web-application-type=servlet
spring.main.allow-bean-definition-overriding=true

# ===============================
# SPRING SECURITY / KEYCLOAK JWT
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/workify}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/workify/protocol/openid-connect/certs}

# ===============================
# MAIL CONFIGURATION
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=nourjbeli78@gmail.com
spring.mail.password=xoglkcxbcwdxqxyo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

# ===============================
# USER SERVICE URL
# ===============================
user-service.url=http://localhost:8081

# ===============================
# OPENAI AI
# ===============================
openai.api.key=${GROQ_API_KEY:your-groq-api-key-here}
openai.api.url=https://api.groq.com/openai/v1/chat/completions
openai.model=llama-3.3-70b-versatile

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
