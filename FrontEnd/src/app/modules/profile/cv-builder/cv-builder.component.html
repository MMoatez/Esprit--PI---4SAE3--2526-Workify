<div class="h-[calc(100vh-80px)] w-full flex flex-col bg-slate-50">
    <!-- Header banner -->
    <div class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center gap-4">
            <button routerLink="/profile"
                class="text-slate-500 hover:text-slate-800 transition-colors flex items-center gap-1 font-medium bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Profile
            </button>
            <h1 class="text-xl font-bold text-slate-900 border-l border-slate-300 pl-4">CV Builder</h1>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-sm font-medium text-slate-500 hidden sm:inline-block">Powered by OpenResume</span>
        </div>
    </div>

    <!-- Iframe Container -->
    <div class="flex-1 w-full bg-slate-100 relative">
        <div *ngIf="!iframeUrl" class="absolute inset-0 flex items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
        </div>
        <iframe *ngIf="iframeUrl" [src]="iframeUrl" class="w-full h-full border-none shadow-inner"
            title="OpenResume CV Builder"></iframe>
    </div>
</div>
